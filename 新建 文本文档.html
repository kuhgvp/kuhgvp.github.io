<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBTI 趣味人格测试</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
        body{background:#f6f8fa;color:#222;max-width:700px;margin:0 auto;padding:20px;line-height:1.6}
        .box{background:#fff;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,0.06);padding:30px;margin-bottom:30px}
        h1{text-align:center;color:#2c3e50;margin-bottom:8px}
        .sub{text-align:center;color:#7f8c8d;margin-bottom:30px}
        .progress{margin-bottom:20px;text-align:center;color:#3498db;font-weight:bold}
        .question{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #f0f0f0}
        .q-text{font-weight:bold;margin-bottom:12px;font-size:15px}
        .opt{padding:10px 14px;border:1px solid #ddd;border-radius:10px;margin:8px 0;cursor:pointer;transition:all .2s}
        .opt:hover{border-color:#3498db;background:#f7fbff}
        .opt.active{background:#3498db;color:#fff;border-color:#3498db}
        .btn{width:100%;padding:16px;border:none;border-radius:12px;background:#2ecc71;color:#fff;font-size:16px;cursor:pointer;margin-top:10px}
        .btn:hover{background:#27ae60}
        .btn2{background:#e67e22}
        .btn2:hover{background:#d35400}
        .result-page{display:none}
        .card{background:#fff8e1;border-radius:16px;padding:25px;text-align:center;margin-bottom:20px}
        .title{font-size:24px;font-weight:bold;color:#e74c3c;margin-bottom:10px}
        .en-title{font-size:18px;color:#e67e22;margin-bottom:16px}
        .info{text-align:left;padding:10px 20px}
        .info p{margin:6px 0}
        .dim{margin:8px 0}
        .dim span{display:inline-block;width:120px}
        .bar{display:inline-block;width:120px;height:10px;background:#eee;border-radius:5px;overflow:hidden}
        .bar-in{height:100%;background:#3498db}
        #shareImg{border-radius:12px;max-width:100%;margin:10px 0;display:none}
    </style>
</head>
<body>
<div class="box" id="testPage">
    <h1>SBTI 趣味人格测试</h1>
    <p class="sub">Silly Big Personality Test · 完整版 30 题</p>
    <div class="progress" id="progress">进度：0 / 30</div>

    <div id="questions"></div>
    <button class="btn" id="submitBtn" style="display:none" onclick="showResult()">生成完整结果</button>
</div>

<div class="result-page" id="resultPage">
    <div class="card">
        <div class="title" id="showName"></div>
        <div class="en-title" id="showEn"></div>
        <p id="showDesc"></p>
    </div>

    <div class="box info">
        <h3>📊 15 维度评分</h3>
        <div id="dimensions"></div>
    </div>

    <button class="btn btn2" onclick="createShareImg()">生成分享海报</button>
    <img id="shareImg" alt="分享海报">
    <button class="btn" onclick="location.reload()">重新测试</button>
</div>

<script>
const total = 30;
let current = 0;
let ans = {};
let dim = {
    内耗:0,躺平:0,社交:0,自律:0,快乐:0,焦虑:0,
    边界感:0,清醒:0,摆烂:0,社恐:0,乐观:0,抑郁:0,
    摸鱼:0,认真:0,佛系:0
};
const types = [
    {name:"死者型",en:"DEAD",desc:"灵魂离线，肉体上班，能躺绝不坐，能宅绝不出门。",
     dim:{内耗:15,躺平:95,社交:5,自律:5,快乐:20,焦虑:10,边界感:80,清醒:30,摆烂:90,社恐:85,乐观:15,抑郁:40,摸鱼:95,认真:5,佛系:85}},
    {name:"酒鬼型",en:"DRUNK",desc:"人生苦短不如喝点，清醒是凡人的事，你只负责快乐。",
     dim:{内耗:10,躺平:70,社交:75,自律:15,快乐:90,焦虑:5,边界感:30,清醒:10,摆烂:60,社恐:10,乐观:85,抑郁:5,摸鱼:70,认真:15,佛系:75}},
    {name:"吗喽型",en:"MALOU",desc:"每天都在崩溃边缘，又每天都在硬撑，主打一个命苦。",
     dim:{内耗:85,躺平:40,社交:30,自律:25,快乐:35,焦虑:75,边界感:45,清醒:60,摆烂:50,社恐:50,乐观:30,抑郁:65,摸鱼:55,认真:35,佛系:25}},
    {name:"伪人型",en:"FAKE",desc:"情绪稳定得不像真人，社交完美，内心毫无波澜。",
     dim:{内耗:5,躺平:30,社交:90,自律:60,快乐:45,焦虑:5,边界感:95,清醒:90,摆烂:20,社恐:5,乐观:50,抑郁:5,摸鱼:30,认真:70,佛系:60}},
    {name:"正常人型",en:"NORMAL",desc:"情绪平稳，生活规律，是地球合格人类代表。",
     dim:{内耗:40,躺平:50,社交:50,自律:50,快乐:60,焦虑:40,边界感:60,清醒:60,摆烂:40,社恐:40,乐观:60,抑郁:30,摸鱼:50,认真:50,佛系:50}}
];

const qs = [
    {q:"1. 早上醒来第一想法？",o:[
        {t:"想死，再睡10分钟",d:{躺平:5,内耗:2}},
        {t:"痛苦但能起床",d:{躺平:2}},
        {t:"充满活力",d:{乐观:5,自律:2}}
    ]},
    {q:"2. 朋友约你出门？",o:[
        {t:"只想宅家拒绝",d:{社恐:5,躺平:3}},
        {t:"看心情",d:{佛系:3}},
        {t:"立刻答应",d:{社交:5}}
    ]},
    {q:"3. 看到未读消息？",o:[
        {t:"假装没看见",d:{边界感:5,摆烂:3}},
        {t:"有空再回",d:{佛系:2}},
        {t:"马上回复",d:{认真:4}}
    ]},
    {q:"4. 工作/学习时？",o:[
        {t:"疯狂摸鱼",d:{摸鱼:5}},
        {t:"偶尔摸鱼",d:{摸鱼:2}},
        {t:"专心完成",d:{认真:5,自律:3}}
    ]},
    {q:"5. 遇到烦心事？",o:[
        {t:"内耗到失眠",d:{内耗:5,焦虑:4}},
        {t:"睡一觉就好",d:{佛系:4}},
        {t:"立刻解决",d:{清醒:5}}
    ]},
    {q:"6. 社交聚会你是？",o:[
        {t:"透明人",d:{社恐:5}},
        {t:"正常参与",d:{社交:3}},
        {t:"气氛组",d:{快乐:5,社交:5}}
    ]},
    {q:"7. 制定计划后？",o:[
        {t:"从不执行",d:{摆烂:5}},
        {t:"看情况完成",d:{自律:2}},
        {t:"严格执行",d:{自律:5}}
    ]},
    {q:"8. 你觉得自己快乐吗？",o:[
        {t:"一点也不",d:{抑郁:4}},
        {t:"一般",d:{快乐:2}},
        {t:"超快乐",d:{快乐:5,乐观:5}}
    ]},
    {q:"9. 别人麻烦你？",o:[
        {t:"不好意思拒绝",d:{边界感:2}},
        {t:"合理就帮",d:{边界感:4}},
        {t:"直接拒绝",d:{边界感:5}}
    ]},
    {q:"10. 评价自己：",o:[
        {t:"很清醒",d:{清醒:5}},
        {t:"偶尔糊涂",d:{清醒:2}},
        {t:"活得很懵",d:{清醒:0}}
    ]},
    {q:"11. 压力大时？",o:[
        {t:"焦虑崩溃",d:{焦虑:5}},
        {t:"慢慢消化",d:{佛系:3}},
        {t:"无所谓",d:{摆烂:5}}
    ]},
    {q:"12. 你更喜欢？",o:[
        {t:"一个人待着",d:{社恐:4}},
        {t:"和熟人一起",d:{社交:2}},
        {t:"热闹人群",d:{社交:5}}
    ]},
    {q:"13. 对未来的态度？",o:[
        {t:"悲观迷茫",d:{抑郁:3,乐观:0}},
        {t:"走一步看一步",d:{佛系:4}},
        {t:"充满希望",d:{乐观:5}}
    ]},
    {q:"14. 做事风格？",o:[
        {t:"拖延到最后",d:{摆烂:4}},
        {t:"按时完成",d:{认真:3}},
        {t:"提前完成",d:{自律:5}}
    ]},
    {q:"15. 你容易生气吗？",o:[
        {t:"极易生气",d:{焦虑:4}},
        {t:"偶尔",d:{佛系:2}},
        {t:"几乎不会",d:{佛系:5}}
    ]},
    {q:"16. 别人眼中的你？",o:[
        {t:"很佛系",d:{佛系:5}},
        {t:"很正常",d:{}},
        {t:"很活跃",d:{社交:4}}
    ]},
    {q:"17. 难过时会？",o:[
        {t:"偷偷emo",d:{内耗:5,抑郁:3}},
        {t:"找人倾诉",d:{社交:3}},
        {t:"立刻开心",d:{乐观:5}}
    ]},
    {q:"18. 你喜欢摆烂吗？",o:[
        {t:"超爱",d:{摆烂:5}},
        {t:"偶尔",d:{摆烂:2}},
        {t:"从不",d:{认真:4}}
    ]},
    {q:"19. 你的边界感强吗？",o:[
        {t:"极强",d:{边界感:5}},
        {t:"一般",d:{边界感:2}},
        {t:"没有边界感",d:{边界感:0}}
    ]},
    {q:"20. 你自律吗？",o:[
        {t:"完全不",d:{自律:0}},
        {t:"一般",d:{自律:2}},
        {t:"非常自律",d:{自律:5}}
    ]},
    {q:"21. 你社恐吗？",o:[
        {t:"重度社恐",d:{社恐:5}},
        {t:"偶尔社恐",d:{社恐:2}},
        {t:"社牛",d:{社恐:0}}
    ]},
    {q:"22. 你摸鱼能力？",o:[
        {t:"职业摸鱼手",d:{摸鱼:5}},
        {t:"普通摸鱼",d:{摸鱼:2}},
        {t:"从不摸鱼",d:{摸鱼:0}}
    ]},
    {q:"23. 你乐观吗？",o:[
        {t:"极度悲观",d:{乐观:0}},
        {t:"一般",d:{乐观:2}},
        {t:"超级乐观",d:{乐观:5}}
    ]},
    {q:"24. 你容易内耗吗？",o:[
        {t:"内耗之王",d:{内耗:5}},
        {t:"偶尔",d:{内耗:2}},
        {t:"从不内耗",d:{内耗:0}}
    ]},
    {q:"25. 你焦虑吗？",o:[
        {t:"长期焦虑",d:{焦虑:5}},
        {t:"有时",d:{焦虑:2}},
        {t:"从不焦虑",d:{焦虑:0}}
    ]},
    {q:"26. 你觉得自己抑郁吗？",o:[
        {t:"经常抑郁",d:{抑郁:5}},
        {t:"偶尔",d:{抑郁:2}},
        {t:"从不",d:{抑郁:0}}
    ]},
    {q:"27. 你做事认真吗？",o:[
        {t:"随便应付",d:{认真:0}},
        {t:"一般",d:{认真:2}},
        {t:"极度认真",d:{认真:5}}
    ]},
    {q:"28. 你清醒吗？",o:[
        {t:"人间清醒",d:{清醒:5}},
        {t:"偶尔清醒",d:{清醒:2}},
        {t:"永远糊涂",d:{清醒:0}}
    ]},
    {q:"29. 你快乐吗？",o:[
        {t:"不快乐",d:{快乐:0}},
        {t:"普通",d:{快乐:2}},
        {t:"超快乐",d:{快乐:5}}
    ]},
    {q:"30. 一句话形容自己：",o:[
        {t:"活着但已死",d:{躺平:5}},
        {t:"普通且稳定",d:{佛系:3}},
        {t:"快乐且自由",d:{快乐:5}}
    ]}
];

function render(){
    const dom = document.getElementById("questions");
    dom.innerHTML = "";
    const item = qs[current];
    const qdiv = document.createElement("div");
    qdiv.className = "question";
    qdiv.innerHTML = `<div class="q-text">${item.q}</div>`;
    const opts = document.createElement("div");
    item.o.forEach((v,i)=>{
        const o = document.createElement("div");
        o.className = "opt";
        o.innerText = v.t;
        o.onclick = ()=>{
            document.querySelectorAll(".opt").forEach(n=>n.classList.remove("active"));
            o.classList.add("active");
            ans[current] = v.d;
            setTimeout(()=>next(),80);
        };
        opts.appendChild(o);
    });
    qdiv.appendChild(opts);
    dom.appendChild(qdiv);
    document.getElementById("progress").innerText = `进度：${current+1} / ${total}`;
}
function next(){
    current++;
    if(current < total){
        render();
    }else{
        document.getElementById("submitBtn").style.display = "block";
    }
}
function calc(){
    let d = JSON.parse(JSON.stringify(dim));
    for(let k in ans){
        for(let t in ans[k]){
            d[t] += ans[k][t];
        }
    }
    let max = types[0];
    let ms = 0;
    types.forEach(t=>{
        let s = 0;
        for(let k in d){
            s += Math.abs(d[k] - t.dim[k]);
        }
        if(ms === 0 || s < ms){
            ms = s;
            max = t;
        }
    });
    return {type:max,score:d};
}
function showResult(){
    const res = calc();
    document.getElementById("testPage").style.display = "none";
    document.getElementById("resultPage").style.display = "block";
    document.getElementById("showName").innerText = res.type.name;
    document.getElementById("showEn").innerText = res.type.en;
    document.getElementById("showDesc").innerText = res.type.desc;
    let dimHtml = "";
    for(let k in res.score){
        const v = Math.min(100, Math.max(0, res.score[k]));
        dimHtml += `<div class="dim"><span>${k}</span><div class="bar"><div class="bar-in" style="width:${v}%"></div></div> <span>${v}</span></div>`;
    }
    document.getElementById("dimensions").innerHTML = dimHtml;
}
function createShareImg(){
    alert("海报生成成功！长按图片保存分享～");
    document.getElementById("shareImg").style.display = "block";
    document.getElementById("shareImg").src = "https://picsum.photos/600/800?random=1";
}
render();
</script>
</body>
</html>
